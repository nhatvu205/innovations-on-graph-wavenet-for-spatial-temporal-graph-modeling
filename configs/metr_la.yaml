# METR-LA experiment configuration
device: "cuda:0"
data: "data/METR-LA"
adjdata: "data/sensor_graph/adj_mx.pkl"
adjtype: "doubletransition"   # forward + backward transition matrices

# Model
gcn_bool: true
addaptadj: true
randomadj: true
aptonly: false
spatial_attention: false
temporal_attention: false
temporal_attention_heads: 4
temporal_attention_dropout: 0.0
temporal_attention_causal: true
seq_length: 12
nhid: 32
in_dim: 2
num_nodes: 207

# Training
batch_size: 64
learning_rate: 0.001
dropout: 0.3
weight_decay: 0.0001
epochs: 100
print_every: 50

# Checkpointing
save: "garage/metr"
expid: 1
seed: 42
eval_horizons: "3,6,12"
metrics_out: "garage/metrics/metr_baseline_seed42.json"
